services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-2-micro
    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: postgres2

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-2-micro
    restart: unless-stopped

    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data
volumes:
    postgres_data:
    redis_data: